name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # bundle.sh stamps the version from `git describe --tags`
      # No Apple Developer ID yet, so releases are ad-hoc signed. A self-signed
      # cert would tie the designated requirement to a certificate leaf only the
      # author's Mac has, making the app fail to launch (amfid "error 162") on
      # everyone else's machine. Ad-hoc's cdhash requirement is self-contained
      # and runs anywhere after a one-time "Open Anyway". When a Developer ID is
      # available, restore the cert import + notarization (plans/260724-notarization).
      - name: Build app bundle
        run: ./scripts/bundle.sh
      - name: Verify signature is portable (ad-hoc, not cert-locked)
        # The opposite guard from the cert era: a certificate-leaf requirement
        # here would mean the release is tied to one Mac and won't launch
        # elsewhere. Ad-hoc (cdhash) is what we want for distribution.
        run: |
          set -euo pipefail
          REQ="$(codesign -d -r- dist/Tokei.app 2>&1 | grep 'designated =>' || true)"
          echo "$REQ"
          if echo "$REQ" | grep -q 'certificate leaf'; then
            echo "error: bundle is cert-signed (certificate-leaf requirement)." >&2
            echo "       It will not launch on other Macs. Release must be ad-hoc." >&2
            exit 1
          fi
          codesign --verify --strict --deep dist/Tokei.app

      - name: Package dmg
        run: |
          mkdir dmg-root
          cp -R dist/Tokei.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Tokei -srcfolder dmg-root -ov -format UDZO "Tokei-${{ github.ref_name }}.dmg"
      - name: Package zip
        # The in-app updater downloads this, not the dmg: no hdiutil mount
        # needed and ditto preserves the bundle's code signature.
        run: ditto -c -k --sequesterRsrc --keepParent dist/Tokei.app "Tokei-${{ github.ref_name }}.zip"
      - name: Create GitHub release
        run: gh release create "${{ github.ref_name }}" Tokei-*.dmg Tokei-*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
